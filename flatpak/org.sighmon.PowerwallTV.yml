app-id: org.sighmon.PowerwallTV
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: powerwall-tv
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: -mod=vendor
modules:
  - name: powerwall-tv
    buildsystem: simple
    build-commands:
      - go build -o /app/bin/powerwall-tv ./cmd/powerwall-tv
      - install -D flatpak/org.sighmon.PowerwallTV.desktop /app/share/applications/org.sighmon.PowerwallTV.desktop
      - install -D flatpak/org.sighmon.PowerwallTV.metainfo.xml /app/share/metainfo/org.sighmon.PowerwallTV.metainfo.xml
      - install -D assets/icons/org.sighmon.PowerwallTV.svg /app/share/icons/hicolor/scalable/apps/org.sighmon.PowerwallTV.svg
    sources:
      - type: dir
        path: ..
